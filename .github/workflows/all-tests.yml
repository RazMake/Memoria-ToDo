# Builds and runs every test kind without publishing.
# Design: docs/architecture/releasing.md, "Every push to main runs every test".
name: Run All tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install the Android workload, which every build needs
        run: dotnet workload install android
      - name: Install the JDK and Android SDK the Android app builds with
        run: dotnet build src/Android/App/Memoria.ToDo.Android.App.csproj -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=True
      - name: Build the Node.js client, which its tests and the Local API's integration tests load
        working-directory: src/Api/NodeClient
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run every test of the Node.js client
        run: |
          node --test --test-timeout=120000 "tests/Api/NodeClient/*.test.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Android app, which the solution leaves out
        run: dotnet build src/Android/App/Memoria.ToDo.Android.App.csproj
      - name: Build and run every test
        run: |
          node .agents/desktop-check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test "-p:MemoriaAllTestKinds=true" --report-xunit-junit --results-directory all-test-results --results-directory-layout per-module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save failed test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-test-reports-${{ github.run_attempt }}
          path: all-test-results/**/*.junit.xml
          retention-days: 7
          if-no-files-found: warn
