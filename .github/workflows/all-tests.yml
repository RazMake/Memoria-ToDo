# Builds and runs every test kind, and publishes nothing. Started by hand, or called by the release workflow.
# Design: docs/architecture/releasing.md, "Three workflows, one for pushes, two you start by hand".
name: Run All tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  full-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and run every test
        run: |
          node .agents/desktop-check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test "-p:MemoriaAllTestKinds=true"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
