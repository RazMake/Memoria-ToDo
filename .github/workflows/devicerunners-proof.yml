name: Verify DeviceRunners Android

on:
  push:
    branches: [proofs]
    paths:
      - proofs/DeviceRunners/**
      - .github/workflows/devicerunners-proof.yml

permissions:
  contents: read

jobs:
  android-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: main-source
    env:
      SOURCE_REF: c401d3b6c00bd1b6699c42131e1ef0d688977009
      PROOF_DIRECTORY: proof
      EMULATOR_PORT: '5554'
      SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ env.PROOF_DIRECTORY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          path: main-source
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: main-source/global.json
      - name: Install MAUI Android using the source repository's pinned workload set
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the source repository's Android SDK and JDK
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'memoria-android-sdk'
          $jdk = Join-Path $env:RUNNER_TEMP 'memoria-jdk'
          $pcFramework = dotnet msbuild src/Android/App/Memoria.ToDo.Android.App.csproj -getProperty:MemoriaPcTargetFramework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Android/App/Memoria.ToDo.Android.App.csproj -t:InstallAndroidDependencies `
            "-p:TargetFramework=$pcFramework-android" "-p:AndroidSdkDirectory=$sdk" `
            "-p:JavaSdkDirectory=$jdk" -p:AcceptAndroidSDKLicenses=True
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          "JAVA_HOME=$jdk" >> $env:GITHUB_ENV
          "DEVICE=emulator-$env:EMULATOR_PORT" >> $env:GITHUB_ENV
          "ANDROID_AVD_HOME=$env:RUNNER_TEMP/devicerunners-avd" >> $env:GITHUB_ENV
          "ANDROID_USER_HOME=$env:RUNNER_TEMP/devicerunners-android-user" >> $env:GITHUB_ENV
      - name: Install the emulator and create a private virtual device
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' $env:SYSTEM_IMAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'no' | & "$env:ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd `
            --name memoria-devicerunners --package $env:SYSTEM_IMAGE `
            --path "$env:ANDROID_AVD_HOME/memoria-devicerunners.avd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check KVM, boot the headless emulator, and wait for Android
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          nohup "$ANDROID_HOME/emulator/emulator" -avd memoria-devicerunners \
            -port "$EMULATOR_PORT" -no-window -gpu swiftshader_indirect \
            -no-snapshot -no-audio -no-boot-anim \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/emulator.pid"
          timeout 180s "$ANDROID_HOME/platform-tools/adb" -s "$DEVICE" wait-for-device
          timeout 180s "$ANDROID_HOME/platform-tools/adb" -s "$DEVICE" shell \
            'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
      - name: Verify the native screen, filtered execution, and assertion failure
        run: |
          $source = (Get-Location).Path
          & "$env:GITHUB_WORKSPACE/$env:PROOF_DIRECTORY/proofs/DeviceRunners/run-proof.ps1" `
            -SourceRoot $source -Device $env:DEVICE `
            -AndroidSdkDirectory $env:ANDROID_HOME -JavaSdkDirectory $env:JAVA_HOME
      - name: Collect Logcat
        if: always()
        run: |
          if (Test-Path "$env:ANDROID_HOME/platform-tools/adb") {
            & "$env:ANDROID_HOME/platform-tools/adb" -s $env:DEVICE logcat -d `
              > "$env:RUNNER_TEMP/device.log"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Logcat could not be collected; check the emulator log.'
            }
          }
      - name: Save the proof's results and emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devicerunners-android-proof
          path: |
            ${{ env.PROOF_DIRECTORY }}/proofs/DeviceRunners/test-results/
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/device.log
          retention-days: 7
          if-no-files-found: error
      - name: Stop the emulator this job started
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/emulator.pid")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
            fi
          fi
