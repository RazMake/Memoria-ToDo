# Plans, tests, tags, then publishes one release. Started by hand, by the release command.
# Design: docs/architecture/releasing.md, "A release run plans, tests, tags, then publishes".
name: Test then Tag and Release

run-name: Release ${{ inputs.part || 'default part' }}

on:
  workflow_dispatch:
    inputs:
      part:
        description: The version part to raise, major, minor, or patch. Empty means the default part.
        type: string
        required: false
        default: ''
      tag:
        description: The tag the release command previewed. Empty means no check.
        type: string
        required: false
        default: ''
      commit:
        description: The full ID of the commit the release command previewed. Empty means the run's commit.
        type: string
        required: false
        default: ''

# One release at a time, each waiting its turn.
concurrency:
  group: release
  queue: max

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  plan:
    name: Plan
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      passed: ${{ steps.reuse.outputs.passed }}
    env:
      PART: ${{ inputs.part }}
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ inputs.commit }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fail unless the run is on the default branch
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
            throw "Start the release on the default branch, '$env:DEFAULT_BRANCH', not on '$env:GITHUB_REF_NAME'. Nothing was published."
          }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail when the previewed commit is not this run's commit
        run: |
          if ($env:COMMIT -and $env:COMMIT -ne $env:GITHUB_SHA) {
            throw "The branch moved: the release was previewed on $env:COMMIT, and this run is on $env:GITHUB_SHA. Nothing was published."
          }
      - name: Plan the tag
        id: next
        run: |
          $arguments = @()
          if ($env:PART) { $arguments += $env:PART }
          $arguments += '--commit', $env:GITHUB_SHA
          if ($env:TAG) { $arguments += '--expect', $env:TAG }
          $arguments += '--dry-run'
          $preview = node .agents/version-tag.mjs @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preview
          $last = @($preview)[-1]
          if ($last -notmatch '--expect (\S+)') { throw "The preview names no tag: $last" }
          "tag=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Look for a passed Run All tests run of this commit
        id: reuse
        run: |
          $url = node .agents/full-run-check.mjs --repo $env:GITHUB_REPOSITORY --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($url) {
            "passed=true" >> $env:GITHUB_OUTPUT
            "::notice::Reusing the passed Run All tests run $url"
            "Reusing the passed [Run All tests run]($url) of this commit." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "passed=false" >> $env:GITHUB_OUTPUT
            "::notice::No passed Run All tests run of this commit, so Tests runs every test."
            "No passed Run All tests run of this commit, so Tests runs every test." >> $env:GITHUB_STEP_SUMMARY
          }

  tests:
    name: Tests
    needs: plan
    if: needs.plan.outputs.passed != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/all-tests.yml

  tag:
    name: Tag
    needs: [plan, tests]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      PART: ${{ inputs.part }}
      PLANNED_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Make and push the tag
        run: |
          $arguments = @()
          if ($env:PART) { $arguments += $env:PART }
          $arguments += '--commit', $env:GITHUB_SHA, '--expect', $env:PLANNED_TAG
          node .agents/version-tag.mjs @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: Publish
    needs: [plan, tests, tag]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') && needs.tag.result == 'success' }}
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PLANNED_TAG: ${{ needs.plan.outputs.tag }}
      # The installer ID is the folder name under %LocalAppData%, and can't change after the first release.
      INSTALLER_ID: MemoriaToDo
      APP_PROJECT: src/Desktop/App/Memoria.ToDo.Desktop.App.csproj
      APP_EXE: Memoria.ToDo.Desktop.App.exe
      APP_ICON: src/Desktop/App/app.ico
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          fetch-depth: 0
      - name: Take the version from the tag, or fail on a tag that isn't a version tag
        run: |
          $version = node .agents/version-tag.mjs --check $env:PLANNED_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Write the version's release notes from the changelog, or fail when it has none
        run: |
          node .agents/version-tag.mjs --notes $env:PLANNED_TAG > release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Read the app's name from its Product property, and fail if it's empty
        run: |
          $name = (dotnet msbuild $env:APP_PROJECT -getProperty:Product).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $name) { throw "The app's Product property is empty. Set <Product> in Directory.Build.props." }
          "APP_NAME=$name" >> $env:GITHUB_ENV
      - name: Publish the desktop app, self-contained for x64
        run: dotnet publish $env:APP_PROJECT -c Release -r win-x64 --self-contained true -o publish "-p:Version=$env:VERSION"
      - name: Restore the pinned vpk
        run: dotnet tool restore
      - name: Download the last release, which the new one's delta packages build on
        run: dotnet vpk download github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GITHUB_TOKEN
      - name: Pack the installer and update files, with no portable zip
        run: >
          dotnet vpk pack --packId $env:INSTALLER_ID --packVersion $env:VERSION --packDir publish
          --mainExe $env:APP_EXE --packTitle $env:APP_NAME --icon $env:APP_ICON
          --runtime win-x64 --shortcuts StartMenuRoot --noPortable --releaseNotes release-notes.md
      - name: Pack the .NET client, which holds the contract's assembly
        run: dotnet pack src/Api/Client/Memoria.ToDo.Api.Client.csproj -c Release -o packages "-p:Version=$env:VERSION"
      - name: Pack the Node.js client
        working-directory: src/Api/NodeClient
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm version $env:VERSION --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack --pack-destination ../../../packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the installer and update files to a draft release, which no user or installed app sees
        # Without --publish, vpk leaves the release a draft.
        run: >
          dotnet vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GITHUB_TOKEN
          --releaseName "$env:APP_NAME $env:VERSION" --tag "v$env:VERSION"
      - name: Attach the client packages to the draft
        run: |
          gh release upload "v$env:VERSION" (Get-ChildItem packages/*.nupkg, packages/*.tgz).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the release, now that everything is attached
        run: |
          gh release edit "v$env:VERSION" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
